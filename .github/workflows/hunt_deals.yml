name: Deal Radar Worker

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deal-radar-worker
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run worker
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          GUNBROKER_DEV_KEY: ${{ secrets.GUNBROKER_DEV_KEY }}
        run: python worker.py

      - name: Commit updated feed
        run: |
          git config user.name "deal-radar-bot"
          git config user.email "deal-radar-bot@users.noreply.github.com"
          if [ -f feed_data.json ]; then git add feed_data.json; fi
          if git diff --staged --quiet; then
            echo "No feed changes to commit"
          else
            git commit -m "Auto-update live feed [skip ci] [skip render]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
