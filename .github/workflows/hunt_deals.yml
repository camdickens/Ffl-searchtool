name: 24/7 Autonomous Gun Sourcing Engine

on:
  schedule:
    # Runs automatically every 30 minutes, 24/7
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual one-tap execution anytime

permissions:
  contents: write

jobs:
  run-sourcing-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Sourcing & Alert Engine
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          python worker.py

      - name: Commit Fresh Feed to Dashboard
        run: |
          git config --local user.email "worker@dealradar.internal"
          git config --local user.name "Sourcing Engine Bot"
          git add feed_data.json seen_lots.json registered_dealers.json || true
          git diff-index --quiet HEAD || (git commit -m "Auto-update live feed [skip ci]" && git push)
